[workspace]
resolver = "3"
members = ["crates/ncm-model", "crates/ncm-bench", "crates/ncm-sft"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
