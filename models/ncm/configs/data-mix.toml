# NCM pretraining data mix (plan stage 2). Every source is an ungated Hugging Face dataset pinned
# to a commit revision, with a licence that allows training and redistributing derived models.
#
# Rules applied to every source:
#   1. Not gated: nothing here needs an accepted agreement or a token.
#   2. Licence: permissive or attribution-style (ODC-By, CC BY, Apache-2.0, Blue Oak-listed code).
#   3. No Claude data: each dataset card was read for Claude or Anthropic involvement as a data
#      generator or filter; none mentions either. Synthetic sets name their generator models
#      (DeepSeek-R1, QwQ-32B, Qwen3, GPT-OSS, Llama 3), recorded under `generators`.
#   4. Crawl and paper dates: web text and papers dated March 2023 or later are dropped (Claude 1
#      shipped in March 2023), because AI-written text on the web grows after that.
#
# Shares are fractions of `budget_tokens` and sum to 1. `phase = "anneal"` sources are only
# sampled in the last `anneal.fraction` of pretraining; `anneal.shares` is the mix for that phase
# (it reuses main-phase sources with more weight on maths, papers and reasoning).
# `est_tokens` estimates the tokens, in this tokenizer, that the selected files hold (stride and
# max_files choose them): the tokens measured on the stage 2 proof sample, scaled by file size. It
# should exceed the target `share` x `budget_tokens`, so tokenising meets every target.

budget_tokens = 20_000_000_000
val_fraction = 0.005

[anneal]
fraction = 0.10

[anneal.shares]
fineweb-edu = 0.10
stack-edu = 0.10
pes2o = 0.10
finemath = 0.20
openthoughts3 = 0.20
openmathreasoning = 0.20
openr1-math = 0.10

# ---- educational web text: 45% ----------------------------------------------------------------

[[source]]
name = "fineweb-edu"
category = "web"
phase = "main"
repo = "HuggingFaceFW/fineweb-edu"
revision = "87f09149ef4734204d70ed1d046ddc9ca3f2b8f9"
license = "ODC-By-1.0 (and Common Crawl terms of use)"
gated = false
share = 0.45
est_tokens = 10_260_000_000
kind = "text"
glob = "data/CC-MAIN-{2013,2014,2015,2016,2017,2018,2019,2020,2021,2022}-*/*.parquet"
stride = 130
interleave = 2
claude_check = "Card read; no Claude or Anthropic use. Quality labels come from a classifier trained on Llama-3-70B-Instruct annotations. Only crawls from 2013 to 2022 are taken."
generators = "Llama-3-70B-Instruct (annotations for the educational-score classifier); text is human web text"
note = "Educational-score 3 and above web pages, English. Files are spread evenly over crawls by stride."

# ---- code: 25% --------------------------------------------------------------------------------

[[source]]
name = "stack-edu"
category = "code"
phase = "main"
repo = "common-pile/stackv2_edu_filtered"
revision = "c354dbe88469a1153e97c6a63ac50591849654de"
license = "Per file, Blue Oak Council permissive licences (MIT, Apache-2.0, BSD and similar); see metadata.license"
gated = false
share = 0.25
est_tokens = 6_340_000_000
kind = "text"
glob = "stack-edu-*.json.gz"
stride = 9
interleave = 12
claude_check = "Card read; no Claude or Anthropic use. Code is from GitHub repositories in the Software Heritage snapshot of September 2023; files with a revision date from March 2023 are dropped."
generators = "Educational filter from the StarCoder2 / Stack-Edu classifier (Llama-3-70B-Instruct annotations); code is human-written"
note = "Common Pile's copy of Stack v2 educational code with file contents included. Files are grouped by language (the first 18 are Markdown), so a stride samples every language and files are read round-robin."

[[source.exclude]]
field = "metadata.revision_date"
prefixes = ["2023-03", "2023-04", "2023-05", "2023-06", "2023-07", "2023-08", "2023-09", "2023-10", "2023-11", "2023-12", "2024", "2025"]

