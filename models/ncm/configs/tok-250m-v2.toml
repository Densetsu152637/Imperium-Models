# Token baseline, v2 attention design: the NCM backbone's attention stack over tokens.
# 20 layers alternating gated DeltaNet and sparse retrieval; see docs/attention.md.
# tok-250m.toml is the fallback design.
model = "tok"
attention = "v2"
vocab_size = 32000
d_model = 1024
n_layers = 20
ff_dim = 1700
rope_base_full = 1000000.0   # retrieval layers' decoupled RoPE key
rope_scale_full = 1.0
norm_eps = 1e-6

[v2]
dn_head_dim = 128    # 8 DeltaNet heads
dn_conv = 4
dn_chunk = 64
ret_heads = 8
ret_nope_dim = 128
ret_rope_dim = 64
ret_v_dim = 128
ret_latent = 512     # MLA cache: 512 latent + 64 RoPE key per token
idx_heads = 4
idx_dim = 128
ret_block = 64       # tokens per block
ret_topk = 32        # blocks per query
ret_local = 1024     # most recent tokens, always visible
ret_dense = false    # true for the dense training warm-up
