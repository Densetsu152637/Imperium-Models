[package]
name = "ncm-data"
description = "Stage 2 data pipeline: fetch the pinned sources, train the shared BPE tokenizer, tokenise into shards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ncm_data"

[[bin]]
name = "ncm-data"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
ncm-model = { path = "../ncm-model" }
flate2 = "1"
globset = "0.4"
hex = "0.4"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# onig regexes only; no progress bars or HTTP client.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
parquet = { version = "60", default-features = false, features = ["snap", "zstd", "lz4", "flate2-zlib-rs", "json"] }

[dev-dependencies]
tempfile = "3"
