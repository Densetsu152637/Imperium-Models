[project]
name = "ncm"
version = "0.0.0"
description = "Next Concept Modelling (NCM) and token-baseline models for Imperium: stage 1 speed gate"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.8"]

[project.scripts]
ncm-bench = "ncm.bench:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
default-groups = ["dev"]

# CI (Linux) installs the CPU wheel so it never downloads CUDA; Windows gets cu128 because
# Blackwell cards (RTX 50 series) need cu128 or newer.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
